name: Web quality gates

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "supabase/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, domain tests, types and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.25.0
          runtime: node@24.12.0
          working-directory: apps/web
          require-lockfile: true
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database-rls:
    name: Supabase DEV RLS and identity transactional smokes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: supabase-dev
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify protected DEV configuration
        shell: bash
        run: |
          if [[ "$SUPABASE_PROJECT_REF" != "xsznvegtaukrvvrgubnn" ]]; then
            echo "The supabase-dev environment must target the designated DEV project."
            exit 1
          fi
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "Configure SUPABASE_DB_URL as a secret in the supabase-dev GitHub Environment."
            exit 1
          fi

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Verify local migrations match Supabase DEV history
        shell: bash
        run: |
          local_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/_.*$//' | sort)"
          remote_versions="$(psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command 'select version from supabase_migrations.schema_migrations order by version' "$SUPABASE_DB_URL")"
          if ! diff --unified=3 <(printf '%s\n' "$local_versions") <(printf '%s\n' "$remote_versions"); then
            echo "Local Supabase migration files do not match the protected DEV migration history. Reconcile filenames/history before continuing."
            exit 1
          fi

      - name: Validate Identity and Tenant transactional smokes
        run: |
          for smoke in \
            supabase/tests/context_rls_smoke.sql \
            supabase/tests/resource_scope_invitation_smoke.sql \
            supabase/tests/resource_role_assignment_smoke.sql \
            supabase/tests/portfolio_project_read_create_smoke.sql \
            supabase/tests/tenant_termination_smoke.sql; do
            echo "Running $smoke"
            psql --no-psqlrc --set ON_ERROR_STOP=1 --file "$smoke" "$SUPABASE_DB_URL"
          done
